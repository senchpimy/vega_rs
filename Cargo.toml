[package]
name = "vega-lite"
version = "0.1.0"
edition = "2021"
description = "A Rust port of Vega-Lite"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
pretty_assertions = "1"

[[bench]]
name = "compile"
harness = false

[workspace]
members = [".", "vega-svg"]
resolver = "2"
